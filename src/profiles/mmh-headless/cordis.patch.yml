# Patch layer for the MiniMax coding profile (dsh --profile mmh-headless).
# Shellular's MiniMax agent (mmh-acp.py) drives this profile — full Harness
# tool loop with MiniMax as the LLM (not the old HTTP chat/completions shim).
#
# Same phone-safe disables as dsh-headless: no interactive prompts, no web
# fan-out that hung Thinking.  Tool approvals stay danger-full-access via
# settings-mmh-headless.yaml + DSH_PERMISSION_MODE.
- id: settings
  config:
    path: /Users/jay/.dsh/settings-mmh-headless.yaml
- id: user-questions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-fetch-http
  disabled: true
