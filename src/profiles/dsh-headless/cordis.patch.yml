# Patch layer for the DSH headless profile.
#
# The phone cannot answer interactive prompts, review plans, or steer
# long-running delegation, and the headless runner emits nothing until the
# final answer — so the tools below are the ones that made "real questions"
# sit on "thinking…" for tens of minutes.  Disabled here; re-enable any row
# if you want that capability from the phone.
#
# Tool approvals are NOT the issue: settings-dsh-headless.yaml (and the bridge's
# DSH_PERMISSION_MODE=danger-full-access) keep sandbox=danger-full-access /
# approval=never.  These rows block or fan out regardless of approval.
- id: settings
  config:
    path: /Users/jay/.dsh/settings-dsh-headless.yaml
- id: user-questions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  disabled: true
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: low
